# Throwaway. A dispatched run can create a release - the first probe proved
# that - so the 403 on the pack's publish has another cause. This separates
# the three candidates: a rule protecting the tag, the asset upload, and the
# delete-then-recreate cycle the publish step does.
name: Permission probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which of the three explains the 403
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          echo "===== 1. rules that could protect a tag ====="
          gh api repos/${GITHUB_REPOSITORY}/rulesets 2>&1 | head -30
          echo "--- tag protection (the older mechanism)"
          gh api repos/${GITHUB_REPOSITORY}/tags/protection 2>&1 | head -10

          echo
          echo "===== 2. a release carrying an asset ====="
          head -c 1048576 /dev/urandom > probe-asset.bin
          if gh release create probe-asset probe-asset.bin \
              --title "probe" --notes "throwaway" --target "$GITHUB_SHA"; then
            echo "RESULT: an asset is fine"
            gh release delete probe-asset --yes --cleanup-tag || true
          else
            echo "RESULT: the asset is what fails"
          fi

          echo
          echo "===== 3. delete --cleanup-tag, then recreate the same tag ====="
          gh release create probe-cycle --notes "first" --target "$GITHUB_SHA" || true
          gh release delete probe-cycle --yes --cleanup-tag 2>/dev/null || true
          if gh release create probe-cycle probe-asset.bin \
              --title "probe" --notes "second" --target "$GITHUB_SHA"; then
            echo "RESULT: recreating a just-deleted tag is fine"
            gh release delete probe-cycle --yes --cleanup-tag || true
          else
            echo "RESULT: recreating a just-deleted tag is what fails"
          fi

          echo
          echo "===== 4. the exact tag the pack uses ====="
          if gh release create runtime-packs --notes "probe" --target "$GITHUB_SHA"; then
            echo "RESULT: the runtime-packs tag itself is fine"
            gh release delete runtime-packs --yes --cleanup-tag || true
          else
            echo "RESULT: the runtime-packs tag specifically is refused"
          fi
