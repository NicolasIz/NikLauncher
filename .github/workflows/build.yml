name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Test :core and assemble the APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The GLFW bridge core is written free of Android headers so it can be
      # checked here in seconds, rather than on a device after a full build.
      - name: Test the native core
        run: ./tools/run-native-tests.sh

      # :core holds the version resolution, download and launch logic, and is
      # pure Kotlin/JVM so it can be tested without a device or an emulator.
      - name: Test :core
        run: ./gradlew :core:test

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug

      # The whole point of resolving EGL by hand: a DT_NEEDED on the system
      # libEGL would have the loader bind every egl* call to the device's
      # driver before Mesa's copy is ever opened, and Zink could never work.
      # That is invisible in the source once it regresses - someone re-adds a
      # find_library, or a new direct call slips in - so it is asserted on the
      # built object. The host readelf reads an aarch64 ELF fine.
      - name: Check the GLFW bridge binds no graphics driver at load time
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          tmp=$(mktemp -d)
          unzip -q -o "$apk" 'lib/arm64-v8a/libglfw.so' -d "$tmp"
          so="$tmp/lib/arm64-v8a/libglfw.so"

          echo "libglfw.so needs:"
          readelf -d "$so" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/  \1/p'

          if readelf -d "$so" | grep -qE 'NEEDED.*\[lib(EGL|GLESv2|GLESv3|GL)\.so'; then
            echo "libglfw.so is linked against a graphics driver." >&2
            echo "Those must be resolved at runtime instead - see glfw/nikegl.c." >&2
            exit 1
          fi
          echo "ok: no graphics driver bound at load time"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: NikLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts are zipped and need a signed-in GitHub session, which
      # makes them awkward to install on the phone the APK is built for. A
      # rolling pre-release exposes the .apk as a direct, installable download.
      - name: Publish the APK as a rolling pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No APK produced" >&2
            exit 1
          fi

          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          version=${version:-0.0.0}
          asset="NikLauncher-${version}-debug.apk"
          cp "$apk" "$asset"

          cat > release-notes.md <<NOTES
          Build de desarrollo de NikLauncher, desde el commit \`${GITHUB_SHA:0:7}\`.

          **Descarga \`${asset}\` directamente e instálalo.** Android pedirá permiso
          para instalar desde un origen desconocido la primera vez.

          Firmada con la clave de depuración. Se instala como \`com.niklauncher.debug\`,
          así que no entra en conflicto con una futura build de release.
          NOTES

          # Recreated each build so the tag always points at the current commit.
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create dev-latest "$asset" \
            --title "NikLauncher $version (desarrollo)" \
            --notes-file release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA"

          echo "Published: $(gh release view dev-latest --json url --jq .url)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/test
          if-no-files-found: ignore
