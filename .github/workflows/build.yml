name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test :core and assemble the APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :core holds the version resolution, download and launch logic, and is
      # pure Kotlin/JVM so it can be tested without a device or an emulator.
      - name: Test :core
        run: ./gradlew :core:test

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: NikLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/test
          if-no-files-found: ignore
