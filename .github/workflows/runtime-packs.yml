name: Runtime packs

# Builds the native components NikLauncher cannot write in Kotlin, from their
# own upstream sources rather than by repackaging someone else's binaries.
#
# Run manually: these builds are slow and their inputs change rarely, so tying
# them to every push would waste minutes without catching anything.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built components as a pre-release"
        type: boolean
        default: false
      # Off by default because it is the one job here that costs the better
      # part of an hour; the other three finish in five minutes. The name said
      # "without building" long after the job stopped being a probe and started
      # building the image, which is a good way to read a green run as proof of
      # something that never ran.
      openjdk:
        description: "Build OpenJDK 21 for Android (slow, ~1h)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Pinned so a pack is reproducible: an unpinned upstream would silently
  # change what ships inside an installed runtime.
  #
  # Not the v1.1.6 tag: that release declares cmake_minimum_required(2.8.12)
  # with no upper bound, which leaves CMP0057 at OLD and makes the NDK's own
  # toolchain file fail on its use of IN_LIST. This commit declares the
  # 2.8.12...3.10 range, which turns the policy on.
  GL4ES_REF: 81547d986798e876de8b434193920b606a72363f
  LWJGL_REF: "3.3.6"
  LIBFFI_VERSION: "3.4.6"
  NDK_VERSION: "27.0.12077973"
  ANDROID_API: "31"
  ANDROID_ABI: arm64-v8a

  # Mesa lives on gitlab.freedesktop.org, which is not reachable from the
  # environment this workflow is written in - only from the runner. So the
  # options below were not verified locally the way gl4es and LWJGL were, and
  # the probe job exists to read them from the source itself.
  MESA_REF: "mesa-25.1.5"
  LIBDRM_REF: "libdrm-2.4.124"

  # JDK 21, not the Mobile Project's own branch. Mobile carries the Android
  # support but only on master, currently JDK 28, where sun.misc.Unsafe's memory
  # accessors are marked for removal - and Minecraft, its mod loaders and
  # LWJGL's MemoryUtil all lean on those. So the Android support is ported onto
  # 21u instead, which is the version the game actually expects.
  OPENJDK_REF: jdk-21.0.12+8

jobs:
  gl4es:
    name: Build gl4es (OpenGL 2.1 over GLES)
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch gl4es
        run: |
          set -euo pipefail
          git clone https://github.com/ptitSeb/gl4es.git upstream-gl4es
          cd upstream-gl4es
          git checkout "$GL4ES_REF"
          echo "Building gl4es at $(git rev-parse --short HEAD)"

      # NOX11 is what makes this usable on Android: there is no X server.
      #
      # The EGL wrapper is deliberately off. It exists so a program calling EGL
      # directly gets gl4es's shims, but NikLauncher's GLFW bridge creates the
      # EGL context itself against the SurfaceView and then hands the current
      # context to libGL. Wrapping EGL as well would duplicate that layer - and
      # it does not even link under NOX11, since the wrapper needs a GLX symbol
      # that NOX11 leaves out of the build.
      #
      # The 16 KB max page size keeps the object loadable on Android 15 kernels
      # that moved off 4 KB pages.
      - name: Configure
        run: |
          set -euo pipefail
          cmake -S upstream-gl4es -B upstream-gl4es/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID=ON \
            -DNOX11=ON \
            -DUSE_ANDROID_LOG=ON \
            -DEGL_WRAPPER=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_DEFAULT_CMP0057=NEW \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"

      - name: Build
        run: cmake --build upstream-gl4es/build --parallel "$(nproc)"

      - name: Collect the shared objects
        run: |
          set -euo pipefail
          mkdir -p out/gl4es
          found=$(find upstream-gl4es -name 'libGL.so*' | sort)
          if [ -z "$found" ]; then
            echo "gl4es produced no libGL" >&2
            find upstream-gl4es -name '*.so*' | head -20 >&2
            exit 1
          fi
          for lib in $found; do
            # Strip the .so.1 versioning: Android's loader wants a plain name.
            base=$(basename "$lib" | sed 's/\.so\..*/.so/')
            cp -v "$lib" "out/gl4es/$base"
          done
          ls -la out/gl4es

      - name: Verify the objects are 16 KB aligned and arm64
        run: |
          set -euo pipefail
          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for lib in out/gl4es/*.so; do
            echo "--- $lib"
            "$readelf" -h "$lib" | grep -E "Machine|Class"
            # Every PT_LOAD must be aligned to at least 16 KB (0x4000).
            aligns=$("$readelf" -l "$lib" | awk '/LOAD/ {print $NF}')
            for align in $aligns; do
              value=$((align))
              if [ "$value" -lt 16384 ]; then
                echo "PT_LOAD alignment $align is below 16 KB in $lib" >&2
                exit 1
              fi
            done
            echo "alignment ok: $aligns"
          done

      - name: Describe the component
        run: |
          set -euo pipefail
          cat > out/gl4es/component.json <<JSON
          {
            "id": "gl4es",
            "backendId": "gl4es",
            "upstream": "https://github.com/ptitSeb/gl4es",
            "upstreamRef": "${GL4ES_REF}",
            "license": "MIT",
            "abi": "${ANDROID_ABI}",
            "minSdk": ${ANDROID_API},
            "maxPageSizeBytes": 16384
          }
          JSON
          cat out/gl4es/component.json

      - name: Package
        run: |
          set -euo pipefail
          (cd out && tar -czf gl4es-${ANDROID_ABI}.tar.gz gl4es)
          sha1sum out/gl4es-${ANDROID_ABI}.tar.gz | tee out/gl4es-${ANDROID_ABI}.tar.gz.sha1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gl4es-${{ env.ANDROID_ABI }}
          path: out/gl4es-*.tar.gz*
          if-no-files-found: error

  lwjgl:
    name: Build LWJGL natives (core and stb)
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # LWJGL links against libffi but bundles only its headers, so it has to
      # be cross-compiled first. Built static: an installed runtime then has
      # one fewer loose shared object to resolve at startup.
      - name: Cross-compile libffi
        run: |
          set -euo pipefail
          toolchain=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64

          curl -fsSL -o libffi.tar.gz \
            "https://github.com/libffi/libffi/releases/download/v${LIBFFI_VERSION}/libffi-${LIBFFI_VERSION}.tar.gz"
          tar xf libffi.tar.gz
          cd "libffi-${LIBFFI_VERSION}"

          export CC="$toolchain/bin/aarch64-linux-android${ANDROID_API}-clang"
          export AR="$toolchain/bin/llvm-ar"
          export RANLIB="$toolchain/bin/llvm-ranlib"
          export CFLAGS="-fPIC -O2"

          ./configure \
            --host=aarch64-linux-android \
            --prefix="$GITHUB_WORKSPACE/ffi-install" \
            --enable-static --disable-shared --disable-docs
          make -j"$(nproc)"
          make install

          echo "libffi built:"
          ls -la "$GITHUB_WORKSPACE/ffi-install/lib"

      - name: Fetch LWJGL
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LWJGL_REF" https://github.com/LWJGL/lwjgl3.git upstream-lwjgl
          echo "Building LWJGL $LWJGL_REF at $(git -C upstream-lwjgl rev-parse --short HEAD)"

      # LWJGL is compiled against the NDK's jni.h but runs against the desktop
      # HotSpot inside the runtime pack, so every (*env)->Function() call takes
      # its offset from one header and dispatches through a table built by the
      # other. Checked here, where both headers actually exist, so an NDK or JDK
      # bump fails the build rather than misdispatching at runtime.
      - name: Check the JNI table layouts agree
        run: |
          set -euo pipefail
          ndk_jni=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/jni.h

          # This job installs no JDK of its own, so take JAVA_HOME when the
          # runner exports one and fall back to whatever is on the image.
          host_jni=${JAVA_HOME:-}/include/jni.h
          if [ ! -f "$host_jni" ]; then
            host_jni=$(find /usr/lib/jvm -name jni.h -path '*/include/jni.h' | sort | tail -1)
          fi
          echo "android: $ndk_jni"
          echo "desktop: $host_jni"
          python3 tools/lwjgl/check-jni-layout.py "$ndk_jni" "$host_jni"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S tools/lwjgl -B build-lwjgl \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLWJGL_DIR="$GITHUB_WORKSPACE/upstream-lwjgl" \
            -DFFI_ROOT="$GITHUB_WORKSPACE/ffi-install"

      - name: Build
        run: cmake --build build-lwjgl --parallel "$(nproc)"

      - name: Collect and verify
        run: |
          set -euo pipefail
          mkdir -p out/lwjgl
          find build-lwjgl -name 'liblwjgl*.so' -exec cp -v {} out/lwjgl/ \;

          if [ ! -f out/lwjgl/liblwjgl.so ]; then
            echo "the LWJGL core library was not produced" >&2
            exit 1
          fi

          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for lib in out/lwjgl/*.so; do
            echo "--- $lib"
            "$readelf" -h "$lib" | grep -E "Machine|Class"
            for align in $("$readelf" -l "$lib" | awk '/LOAD/ {print $NF}'); do
              if [ "$((align))" -lt 16384 ]; then
                echo "PT_LOAD alignment $align is below 16 KB in $lib" >&2
                exit 1
              fi
            done
            echo "alignment ok"
          done

      - name: Describe the component
        run: |
          set -euo pipefail
          cat > out/lwjgl/component.json <<JSON
          {
            "id": "lwjgl",
            "upstream": "https://github.com/LWJGL/lwjgl3",
            "upstreamRef": "${LWJGL_REF}",
            "license": "BSD-3-Clause",
            "bundles": ["libffi ${LIBFFI_VERSION} (MIT, linked statically)"],
            "abi": "${ANDROID_ABI}",
            "minSdk": ${ANDROID_API},
            "maxPageSizeBytes": 16384
          }
          JSON
          cat out/lwjgl/component.json

      - name: Package
        run: |
          set -euo pipefail
          (cd out && tar -czf lwjgl-${ANDROID_ABI}.tar.gz lwjgl)
          sha1sum out/lwjgl-${ANDROID_ABI}.tar.gz | tee out/lwjgl-${ANDROID_ABI}.tar.gz.sha1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-${{ env.ANDROID_ABI }}
          path: out/lwjgl-*.tar.gz*
          if-no-files-found: error

  # Desktop OpenGL over Vulkan, for Minecraft 1.17 and newer.
  #
  # gl4es covers up to 1.16, where the game only asks for GL 2.1. From 1.17 it
  # requires a 3.2 core profile, which gl4es cannot give, so those versions go
  # through Zink on top of the device's own Vulkan driver.
  #
  # No Vulkan driver is built: the S24 Ultra already ships one for its GPU, and
  # replacing a vendor driver with Mesa's would trade something that works for
  # something worse. Zink is the only gallium driver enabled.
  #
  # android-strict is off. Mesa describes it as strict Android compliance,
  # where disabling "may cause CTS failures or other problems, but allows
  # drivers to expose capabilities that are normally hidden". Those hidden
  # capabilities are the desktop GL features Minecraft asks for, and CTS
  # compliance is a requirement for a system graphics driver - which this is
  # not. It is a library an app loads for itself, so nothing here is submitted
  # for certification.
  #
  # Every option below was validated by a configure-only probe before this job
  # was written to compile anything, because Mesa is a long build and finding a
  # typo after fifteen minutes is an expensive way to learn.
  mesa:
    name: Build Mesa/Zink (desktop GL over Vulkan)
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Mesa generates much of its own source, so the host needs the
      # generators: mako for the Python templates, bison and flex for the GLSL
      # parser, glslang for the SPIR-V Zink consumes. None ships in the pack.
      - name: Install Mesa's build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex glslang-tools cmake pkg-config
          python3 -m pip install --quiet --upgrade meson ninja mako pyyaml

      # pkg-config is a real binary, with pkg_config_libdir pointing only at
      # the cross-built dependency tree - so lookups name the dependency that
      # is missing, while nothing from the host can leak into an Android build.
      - name: Write the NDK cross file
        run: |
          set -euo pipefail
          tc=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          deps=$GITHUB_WORKSPACE/android-deps
          mkdir -p "$deps/lib/pkgconfig"
          cat > cross-android-arm64.ini <<INI
          [binaries]
          c = '$tc/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$tc/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$tc/llvm-ar'
          strip = '$tc/llvm-strip'
          pkg-config = 'pkg-config'

          [properties]
          pkg_config_libdir = '$deps/lib/pkgconfig'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          INI

      # Mesa asks for libdrm even with only Zink enabled. Core library only:
      # every hardware-specific backend is off, since the GPU driver on the
      # device is the vendor's.
      - name: Cross-compile libdrm
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LIBDRM_REF" \
            https://gitlab.freedesktop.org/mesa/drm.git upstream-drm
          meson setup upstream-drm/build-android upstream-drm \
            --cross-file "$GITHUB_WORKSPACE/cross-android-arm64.ini" \
            --prefix "$GITHUB_WORKSPACE/android-deps" \
            --buildtype release \
            -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled \
            -Dnouveau=disabled -Dvmwgfx=disabled -Dfreedreno=disabled \
            -Dvc4=disabled -Detnaviv=disabled \
            -Dcairo-tests=disabled -Dman-pages=disabled \
            -Dvalgrind=disabled -Dtests=false \
            -Dc_link_args=-Wl,-z,max-page-size=16384 \
            -Dcpp_link_args=-Wl,-z,max-page-size=16384
          meson compile -C upstream-drm/build-android
          meson install -C upstream-drm/build-android

      - name: Fetch Mesa
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git upstream-mesa
          echo "Mesa $MESA_REF at $(git -C upstream-mesa rev-parse --short HEAD)"

      - name: Configure
        run: |
          set -euo pipefail
          meson setup upstream-mesa/build-android upstream-mesa \
            --cross-file "$GITHUB_WORKSPACE/cross-android-arm64.ini" \
            --buildtype release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers= \
            -Degl=enabled \
            -Dopengl=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dllvm=disabled \
            -Dshared-glapi=enabled \
            -Dc_link_args=-Wl,-z,max-page-size=16384 \
            -Dcpp_link_args=-Wl,-z,max-page-size=16384

      - name: Build
        run: meson compile -C upstream-mesa/build-android

      # Prints everything produced before deciding what to keep: the names Mesa
      # gives its Android libraries are what the GLFW bridge will have to
      # dlopen, so they are read from the build rather than assumed.
      - name: Collect and verify
        run: |
          set -euo pipefail
          echo "===== every shared object Mesa produced ====="
          find upstream-mesa/build-android -name '*.so*' -type f | sort

          # src/android_stub is deliberately excluded. android-stub=true builds
          # fake liblog, libcutils, libhardware, libnativewindow and libsync so
          # Mesa can link without an AOSP tree. They are link-time placeholders;
          # the device has the real ones. Shipping the stubs would put
          # non-functional implementations ahead of the platform's own.
          mkdir -p out/mesa
          find upstream-mesa/build-android -name '*.so' -type f \
            -not -path '*/android_stub/*' \
            -exec cp -v {} out/mesa/ \;
          cp -v "$GITHUB_WORKSPACE/android-deps/lib/libdrm.so" out/mesa/ 2>/dev/null || true

          if [ -z "$(ls -A out/mesa)" ]; then
            echo "Mesa produced no shared objects" >&2
            exit 1
          fi

          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for lib in out/mesa/*.so; do
            echo "--- $lib"
            "$readelf" -h "$lib" | grep -E "Machine|Class"
            for align in $("$readelf" -l "$lib" | awk '/LOAD/ {print $NF}'); do
              if [ "$((align))" -lt 16384 ]; then
                echo "PT_LOAD alignment $align is below 16 KB in $lib" >&2
                exit 1
              fi
            done
            echo "alignment ok"
          done

      # The whole Zink integration rests on this symbol. LWJGL resolves GL
      # functions by looking inside the loaded library for an address-getter,
      # and since Mesa builds no desktop libGL for Android, eglGetProcAddress
      # is the entire path - there is nothing to fall back to. Asserted here
      # rather than discovered as a black screen on the device.
      - name: Check libEGL exports the address-getter LWJGL needs
        run: |
          set -euo pipefail
          nm=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          if ! "$nm" -D --defined-only out/mesa/libEGL.so | grep -q ' eglGetProcAddress$'; then
            echo "libEGL.so does not export eglGetProcAddress; LWJGL would have no" >&2
            echo "way to resolve a single OpenGL function through this pack." >&2
            exit 1
          fi
          echo "eglGetProcAddress: exported"

          echo "EGL entry points exported: $("$nm" -D --defined-only out/mesa/libEGL.so | grep -c ' egl')"

      - name: Describe the component
        run: |
          set -euo pipefail
          cat > out/mesa/component.json <<JSON
          {
            "id": "mesa-zink",
            "backendId": "zink",
            "upstream": "https://gitlab.freedesktop.org/mesa/mesa",
            "upstreamRef": "${MESA_REF}",
            "license": "MIT",
            "bundles": ["libdrm ${LIBDRM_REF} (MIT)"],
            "requiresVulkan": true,
            "androidStrict": false,
            "abi": "${ANDROID_ABI}",
            "minSdk": ${ANDROID_API},
            "maxPageSizeBytes": 16384
          }
          JSON
          cat out/mesa/component.json

      - name: Package
        run: |
          set -euo pipefail
          (cd out && tar -czf mesa-zink-${ANDROID_ABI}.tar.gz mesa)
          sha1sum out/mesa-zink-${ANDROID_ABI}.tar.gz | tee out/mesa-zink-${ANDROID_ABI}.tar.gz.sha1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mesa-zink-${{ env.ANDROID_ABI }}
          path: out/mesa-zink-*.tar.gz*
          if-no-files-found: error

  # OpenJDK 21 for Android arm64, from upstream plus a patch this project owns.
  #
  # The OpenJDK Mobile Project has Android support in tree, but only on master,
  # which is JDK 28 - a development tip where sun.misc.Unsafe's memory accessors
  # carry @Deprecated(forRemoval=true). Minecraft, Fabric, Forge and LWJGL's own
  # MemoryUtil all use exactly those, so a stability-first launcher should not
  # ship it. tools/openjdk/android-aarch64.patch carries the same support onto
  # 21u, the version the game expects.
  #
  # Configure first, behind an input, because it resolves the toolchain and
  # every dependency in a minute where a full JDK build costs the better part of
  # an hour. Same discipline that got Mesa right in three cheap rounds.
  openjdk:
    name: Build OpenJDK 21 for Android
    if: ${{ inputs.openjdk }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # A JDK builds with a JDK. 21 builds itself or is built by 21.
      - name: Set up the boot JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # clang for the host as well as the NDK's clang for the target. The
          # build system takes one toolchain type for both, so with
          # --with-toolchain-type=clang the buildjdk - the JDK compiled for the
          # host to run build tools - is handed clang-only flags. Giving it gcc
          # makes those flags an error rather than a no-op.
          sudo apt-get install -y -qq autoconf zip unzip build-essential file clang \
            libfontconfig1-dev libcups2-dev

          # java.desktop compiles against the fontconfig and CUPS headers but
          # links against neither: both libraries are dlopen'd and every entry
          # point comes from dlsym, so the headers only supply type
          # declarations. There is no CUPS_LIBS or FONTCONFIG_LIBS anywhere in
          # the JDK's make tree - checked - and both headers are plain C API
          # declarations with no architecture in them.
          #
          # They are copied into a private root rather than pointing configure
          # at /usr/include, which would put the host's glibc headers on the
          # cross compile's include path ahead of the NDK sysroot.
          fcinc="$GITHUB_WORKSPACE/host-api-headers"
          mkdir -p "$fcinc"
          cp -a /usr/include/fontconfig "$fcinc/"
          cp -a /usr/include/cups "$fcinc/"
          echo "HOST_API_HEADERS=$fcinc" >> "$GITHUB_ENV"
          echo "provided: $(ls "$fcinc")"

      - name: Fetch OpenJDK 21
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OPENJDK_REF" \
            https://github.com/openjdk/jdk21u.git upstream-jdk
          echo "OpenJDK $OPENJDK_REF at $(git -C upstream-jdk rev-parse --short HEAD)"

      # Applied with --check first, so a patch that no longer fits the upstream
      # tree says so plainly instead of half-applying and failing later in a
      # way that looks like a compiler problem.
      - name: Apply the Android patch
        run: |
          set -euo pipefail
          cd upstream-jdk
          patch_file=$GITHUB_WORKSPACE/tools/openjdk/android-aarch64.patch
          git apply --check "$patch_file"
          git apply --stat "$patch_file"
          git apply "$patch_file"
          echo "patch applied cleanly"

      # Android's build variables now resolve to the linux ones, and LIBS_linux
      # names -lpthread. Bionic keeps pthread inside libc, so whether that links
      # depends on the NDK still shipping a compatibility stub. Printed rather
      # than assumed - if it is absent the link error would be puzzling.
      - name: Check what the NDK provides for -lpthread and -ldl
        run: |
          set -euo pipefail
          sysroot=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          # No pipe here: find piped into head trips pipefail when head closes
          # the pipe early, which killed this step - and the whole run - before
          # configure last time.
          for lib in libpthread.a librt.a libdl.so libdl.a libm.so; do
            found=$(find "$sysroot" -name "$lib" -print -quit 2>/dev/null || true)
            printf '%-14s %s\n' "$lib" "${found:-NOT FOUND}"
          done

      - name: Configure for aarch64-linux-android
        id: configure
        continue-on-error: true
        run: |
          set -euo pipefail
          tc=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          cd upstream-jdk
          # The per-API clang wrapper carries -target itself, which is why the
          # patch does not put the triple in the OS defines: those are applied
          # to the buildjdk too, and a host compiler rejects them.
          #
          # --undefined-version is needed because the NDK ships lld 18, which
          # changed its default to --no-undefined-version. HotSpot's mapfile is
          # generated by scraping symbols out of the object files, so it can
          # legitimately name vtables for function-local classes that the
          # linker then folds away. Older linkers warned; lld 18 errors.
          #
          # max-page-size matches every other component in this workflow. The
          # collect step already refuses an image with a PT_LOAD below 16 KB,
          # and EXTRA_LDFLAGS is the one place that reaches both the JVM and
          # the JDK libraries, so one flag covers the whole image. The buildjdk
          # overrides EXTRA_LDFLAGS away, which is what we want: those run on
          # the runner, not on a phone.
          # Debug symbols off: the default is external, which builds every
          # library with -g and then hands NativeCompilation.gmk an objcopy
          # step it only knows how to write for linux, windows, aix and macosx.
          # The runtime pack is downloaded to a phone, so the smaller unstripped
          # libraries are what we want anyway.
          #
          # Captured rather than only streamed: when configure fails before it
          # creates a build directory there is no config.log to fall back on,
          # and its own output is the only account of what went wrong.
          set +e
          ANDROID_API_LEVEL=${ANDROID_API} bash configure \
            --openjdk-target=aarch64-linux-android \
            --with-boot-jdk="$JAVA_HOME" \
            --with-toolchain-type=clang \
            --with-sysroot="$tc/sysroot" \
            --with-jvm-variants=server \
            --with-debug-level=release \
            --enable-headless-only \
            --disable-warnings-as-errors \
            --with-native-debug-symbols=none \
            --with-fontconfig-include="$HOST_API_HEADERS" \
            --with-cups-include="$HOST_API_HEADERS" \
            --with-extra-ldflags="-Wl,--undefined-version -Wl,-z,max-page-size=16384" \
            CC="$tc/bin/aarch64-linux-android${ANDROID_API}-clang" \
            CXX="$tc/bin/aarch64-linux-android${ANDROID_API}-clang++" \
            BUILD_CC=clang \
            BUILD_CXX=clang++ \
            AR="$tc/bin/llvm-ar" \
            STRIP="$tc/bin/llvm-strip" \
            NM="$tc/bin/llvm-nm" \
            OBJCOPY="$tc/bin/llvm-objcopy" \
            > "$GITHUB_WORKSPACE/configure-output.log" 2>&1
          status=$?
          set -e
          exit $status

      - name: Report what configure said
        if: always()
        run: |
          set -euo pipefail
          if [ -f configure-output.log ]; then
            echo "===== last 120 lines of configure output ====="
            tail -120 configure-output.log
          else
            echo "configure produced no output at all"
          fi
          log=$(find upstream-jdk/build -name config.log -print -quit 2>/dev/null || true)
          if [ -n "$log" ]; then
            echo "===== tail of $log ====="
            tail -60 "$log"
          fi

          # The build writes the exact command line of every failing step here,
          # and points at it in its own error message. A link failure is not
          # diagnosable from the summary alone - whether a library was on the
          # line at all is only visible in the command.
          logs=$(find upstream-jdk/build -type d -name failure-logs -print -quit 2>/dev/null || true)
          if [ -n "$logs" ]; then
            echo "===== failure-logs ====="
            for f in "$logs"/*; do
              echo "--- $(basename "$f")"
              head -40 "$f"
            done
          fi

      - name: Fail if configure failed
        if: steps.configure.outcome == 'failure'
        run: |
          echo "OpenJDK 21 did not configure for Android; see the output above." >&2
          exit 1

      # The real test of the port. Configure only proves the build system
      # accepts the target; this is where HotSpot's linux sources actually
      # compile against Bionic, or do not. The OS defines here are exactly
      # upstream's linux pair, so anything that breaks is a genuine libc
      # difference rather than a define this workflow invented.
      - name: Build the JDK image
        id: build
        continue-on-error: true
        timeout-minutes: 120
        run: |
          set -euo pipefail
          cd upstream-jdk
          make images LOG=warn JOBS="$(nproc)" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"

      - name: Report what the build said
        if: always()
        run: |
          set -euo pipefail
          if [ -f build-output.log ]; then
            echo "===== last 150 lines of the build ====="
            tail -150 build-output.log
            echo "===== error lines ====="
            grep -nE 'error:|Error |\*\*\* ' build-output.log | head -40 || true
          fi

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "OpenJDK 21 configured but did not build for Android." >&2
          exit 1

      - name: Collect and verify the runtime
        run: |
          set -euo pipefail
          image=$(find upstream-jdk/build -maxdepth 2 -type d -name images -print -quit)/jdk
          echo "image: $image"

          if [ ! -f "$image/lib/server/libjvm.so" ]; then
            echo "no libjvm.so in the image; the launcher has nothing to dlopen" >&2
            find upstream-jdk/build -name 'libjvm.so' | head >&2
            exit 1
          fi

          mkdir -p out
          cp -a "$image" out/jdk

          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          echo "--- libjvm.so"
          "$readelf" -h out/jdk/lib/server/libjvm.so | grep -E "Machine|Class"

          # Every shared object in the runtime has to map on a 16 KB-page
          # kernel, not just the one the launcher loads first.
          bad=0
          while read -r lib; do
            for align in $("$readelf" -l "$lib" | awk '/LOAD/ {print $NF}'); do
              if [ "$((align))" -lt 16384 ]; then
                echo "PT_LOAD alignment $align below 16 KB in $lib" >&2
                bad=1
              fi
            done
          done < <(find out/jdk -name '*.so')
          [ "$bad" -eq 0 ] || exit 1
          echo "every shared object is 16 KB aligned"

          echo "runtime size: $(du -sh out/jdk | cut -f1)"

      - name: Describe the component
        run: |
          set -euo pipefail
          cat > out/jdk/component.json <<JSON
          {
            "id": "openjdk",
            "runtimeId": "jre21",
            "upstream": "https://github.com/openjdk/jdk21u",
            "upstreamRef": "${OPENJDK_REF}",
            "license": "GPL-2.0-with-classpath-exception",
            "patch": "tools/openjdk/android-aarch64.patch",
            "abi": "${ANDROID_ABI}",
            "minSdk": ${ANDROID_API},
            "libjvmPath": "lib/server/libjvm.so",
            "maxPageSizeBytes": 16384
          }
          JSON
          cat out/jdk/component.json

      - name: Package
        run: |
          set -euo pipefail
          (cd out && tar -czf openjdk21-${ANDROID_ABI}.tar.gz jdk)
          sha1sum out/openjdk21-${ANDROID_ABI}.tar.gz | tee out/openjdk21-${ANDROID_ABI}.tar.gz.sha1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openjdk21-${{ env.ANDROID_ABI }}
          path: out/openjdk21-*.tar.gz*
          if-no-files-found: error

################################################################################
# Assembles the four components into the single archive the launcher installs.
#
# The launcher extracts a pack into one directory and then looks for libjvm.so
# at the path the pack declares, so the JDK image has to sit at the root. Each
# graphics backend gets its own directory carrying its own copy of the LWJGL
# natives, because org.lwjgl.librarypath is a single directory and is also
# where LWJGL finds its own libraries - the shape is defined and tested in
# :core's RuntimePackLayoutTest, and asserted against the real archive below.
  assemble:
    name: Assemble the runtime pack
    needs: [gl4es, lwjgl, mesa, openjdk]
    if: ${{ inputs.openjdk }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Download the components
        uses: actions/download-artifact@v4
        with:
          path: components

      - name: Unpack them
        run: |
          set -euo pipefail
          mkdir -p unpacked
          for archive in $(find components -name '*.tar.gz' | sort); do
            echo "unpacking $archive"
            tar -xzf "$archive" -C unpacked
          done
          echo "component trees:"
          find unpacked -maxdepth 1 -mindepth 1 -type d | sort

      - name: Stage the pack
        run: |
          set -euo pipefail
          stage=stage
          rm -rf "$stage"
          mkdir -p "$stage"

          # The JDK image at the root, so libjvmPath is lib/server/libjvm.so.
          cp -a unpacked/jdk/. "$stage/"
          rm -f "$stage/component.json"

          # One self-contained directory per backend. Mesa carries Zink;
          # gl4es carries its own libGL. Both also get the LWJGL natives,
          # since librarypath points at exactly one of these directories.
          for backend in zink gl4es; do
            mkdir -p "$stage/nikgraphics/$backend"
          done
          cp -a unpacked/mesa/. "$stage/nikgraphics/zink/"
          cp -a unpacked/gl4es/. "$stage/nikgraphics/gl4es/"
          for backend in zink gl4es; do
            cp -a unpacked/lwjgl/. "$stage/nikgraphics/$backend/"
            rm -f "$stage/nikgraphics/$backend/component.json"
          done

          echo "staged:"
          du -sh "$stage"
          ls "$stage/nikgraphics/zink" "$stage/nikgraphics/gl4es"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="nikruntime-jre21-${ANDROID_ABI}.tar.gz"
          # -C stage . so the archive's entries are the pack's own root: the
          # launcher extracts into one directory and expects no wrapper.
          tar -czf "$name" -C stage .
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha1=$(sha1sum "$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$name")" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      - name: Check the archive is what the launcher expects
        run: |
          set -euo pipefail
          # Extracted the way RuntimePackInstaller does, and checked against the
          # paths the index is about to declare. An archive that packages
          # correctly but extracts into the wrong shape would otherwise only
          # fail on a phone.
          rm -rf verify && mkdir verify
          tar -xzf "${{ steps.package.outputs.name }}" -C verify

          fail=0
          require() {
            if [ ! -e "verify/$1" ]; then echo "missing: $1" >&2; fail=1;
            else echo "  ok  $1"; fi
          }
          require lib/server/libjvm.so
          require bin/java
          require nikgraphics/zink/libEGL.so
          require nikgraphics/zink/liblwjgl.so
          require nikgraphics/gl4es/libGL.so
          require nikgraphics/gl4es/liblwjgl.so
          [ "$fail" -eq 0 ] || exit 1

          # No wrapper directory: a pack that extracted into ./nikruntime/...
          # would put libjvm.so one level below where the manifest says.
          if [ -d verify/jdk ] || [ -d verify/stage ]; then
            echo "the archive has a wrapper directory; libjvmPath would be wrong" >&2
            exit 1
          fi
          echo "archive layout matches the manifest"

      - name: Write the pack index
        run: |
          set -euo pipefail
          # jdk-21.0.12+8 -> 21.0.12, which is what VersionComparator orders.
          version=${OPENJDK_REF#jdk-}
          version=${version%%+*}
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/runtime-packs"

          cat > runtime-packs.json <<JSON
          {
            "schemaVersion": 1,
            "packs": [
              {
                "id": "nikruntime-jre21-${ANDROID_ABI}",
                "runtimeId": "jre21",
                "version": "${version}",
                "abi": "${ANDROID_ABI}",
                "url": "${base}/${{ steps.package.outputs.name }}",
                "sha1": "${{ steps.package.outputs.sha1 }}",
                "size": ${{ steps.package.outputs.size }},
                "libjvmPath": "lib/server/libjvm.so",
                "providedClasspath": [],
                "graphicsBackendIds": ["zink", "gl4es"],
                "graphicsDirectory": "nikgraphics",
                "maxPageSizeBytes": 16384
              }
            ]
          }
          JSON
          python3 -m json.tool runtime-packs.json
          echo "(the url above resolves only once the pack is published)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: runtime-pack-${{ env.ANDROID_ABI }}
          path: |
            nikruntime-jre21-*.tar.gz
            runtime-packs.json
          if-no-files-found: error

      - name: Publish
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Recreated so the tag always names the pack currently indexed.
          gh release delete runtime-packs --yes --cleanup-tag 2>/dev/null || true
          gh release create runtime-packs \
            "${{ steps.package.outputs.name }}" runtime-packs.json \
            --title "NikLauncher runtime packs" \
            --notes "Built from the sources named in each component.json. The launcher reads runtime-packs.json from this release." \
            --target "$GITHUB_SHA"
          gh release view runtime-packs --json url --jq .url
