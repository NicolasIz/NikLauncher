name: Runtime packs

# Builds the native components NikLauncher cannot write in Kotlin, from their
# own upstream sources rather than by repackaging someone else's binaries.
#
# Run manually: these builds are slow and their inputs change rarely, so tying
# them to every push would waste minutes without catching anything.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built components as a pre-release"
        type: boolean
        default: false
      probe_openjdk:
        description: "Configure OpenJDK for Android without building (scaffolding)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Pinned so a pack is reproducible: an unpinned upstream would silently
  # change what ships inside an installed runtime.
  #
  # Not the v1.1.6 tag: that release declares cmake_minimum_required(2.8.12)
  # with no upper bound, which leaves CMP0057 at OLD and makes the NDK's own
  # toolchain file fail on its use of IN_LIST. This commit declares the
  # 2.8.12...3.10 range, which turns the policy on.
  GL4ES_REF: 81547d986798e876de8b434193920b606a72363f
  LWJGL_REF: "3.3.6"
  LIBFFI_VERSION: "3.4.6"
  NDK_VERSION: "27.0.12077973"
  ANDROID_API: "31"
  ANDROID_ABI: arm64-v8a

  # Mesa lives on gitlab.freedesktop.org, which is not reachable from the
  # environment this workflow is written in - only from the runner. So the
  # options below were not verified locally the way gl4es and LWJGL were, and
  # the probe job exists to read them from the source itself.
  MESA_REF: "mesa-25.1.5"
  LIBDRM_REF: "libdrm-2.4.124"

  # The OpenJDK Mobile Project. Its Android support is small - 21 lines across
  # 14 files, only two of them source - because platform.m4 maps android onto
  # HOTSPOT_OS=linux and lets HotSpot's linux code compile against Bionic.
  # Pinned to the commit that was read, not to master.
  OPENJDK_REF: c1ed06aaef34c8dccf71e236d1ffa20918a77cfb

jobs:
  gl4es:
    name: Build gl4es (OpenGL 2.1 over GLES)
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch gl4es
        run: |
          set -euo pipefail
          git clone https://github.com/ptitSeb/gl4es.git upstream-gl4es
          cd upstream-gl4es
          git checkout "$GL4ES_REF"
          echo "Building gl4es at $(git rev-parse --short HEAD)"

      # NOX11 is what makes this usable on Android: there is no X server.
      #
      # The EGL wrapper is deliberately off. It exists so a program calling EGL
      # directly gets gl4es's shims, but NikLauncher's GLFW bridge creates the
      # EGL context itself against the SurfaceView and then hands the current
      # context to libGL. Wrapping EGL as well would duplicate that layer - and
      # it does not even link under NOX11, since the wrapper needs a GLX symbol
      # that NOX11 leaves out of the build.
      #
      # The 16 KB max page size keeps the object loadable on Android 15 kernels
      # that moved off 4 KB pages.
      - name: Configure
        run: |
          set -euo pipefail
          cmake -S upstream-gl4es -B upstream-gl4es/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID=ON \
            -DNOX11=ON \
            -DUSE_ANDROID_LOG=ON \
            -DEGL_WRAPPER=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_DEFAULT_CMP0057=NEW \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"

      - name: Build
        run: cmake --build upstream-gl4es/build --parallel "$(nproc)"

      - name: Collect the shared objects
        run: |
          set -euo pipefail
          mkdir -p out/gl4es
          found=$(find upstream-gl4es -name 'libGL.so*' | sort)
          if [ -z "$found" ]; then
            echo "gl4es produced no libGL" >&2
            find upstream-gl4es -name '*.so*' | head -20 >&2
            exit 1
          fi
          for lib in $found; do
            # Strip the .so.1 versioning: Android's loader wants a plain name.
            base=$(basename "$lib" | sed 's/\.so\..*/.so/')
            cp -v "$lib" "out/gl4es/$base"
          done
          ls -la out/gl4es

      - name: Verify the objects are 16 KB aligned and arm64
        run: |
          set -euo pipefail
          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for lib in out/gl4es/*.so; do
            echo "--- $lib"
            "$readelf" -h "$lib" | grep -E "Machine|Class"
            # Every PT_LOAD must be aligned to at least 16 KB (0x4000).
            aligns=$("$readelf" -l "$lib" | awk '/LOAD/ {print $NF}')
            for align in $aligns; do
              value=$((align))
              if [ "$value" -lt 16384 ]; then
                echo "PT_LOAD alignment $align is below 16 KB in $lib" >&2
                exit 1
              fi
            done
            echo "alignment ok: $aligns"
          done

      - name: Describe the component
        run: |
          set -euo pipefail
          cat > out/gl4es/component.json <<JSON
          {
            "id": "gl4es",
            "backendId": "gl4es",
            "upstream": "https://github.com/ptitSeb/gl4es",
            "upstreamRef": "${GL4ES_REF}",
            "license": "MIT",
            "abi": "${ANDROID_ABI}",
            "minSdk": ${ANDROID_API},
            "maxPageSizeBytes": 16384
          }
          JSON
          cat out/gl4es/component.json

      - name: Package
        run: |
          set -euo pipefail
          (cd out && tar -czf gl4es-${ANDROID_ABI}.tar.gz gl4es)
          sha1sum out/gl4es-${ANDROID_ABI}.tar.gz | tee out/gl4es-${ANDROID_ABI}.tar.gz.sha1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gl4es-${{ env.ANDROID_ABI }}
          path: out/gl4es-*.tar.gz*
          if-no-files-found: error

  lwjgl:
    name: Build LWJGL natives (core and stb)
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # LWJGL links against libffi but bundles only its headers, so it has to
      # be cross-compiled first. Built static: an installed runtime then has
      # one fewer loose shared object to resolve at startup.
      - name: Cross-compile libffi
        run: |
          set -euo pipefail
          toolchain=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64

          curl -fsSL -o libffi.tar.gz \
            "https://github.com/libffi/libffi/releases/download/v${LIBFFI_VERSION}/libffi-${LIBFFI_VERSION}.tar.gz"
          tar xf libffi.tar.gz
          cd "libffi-${LIBFFI_VERSION}"

          export CC="$toolchain/bin/aarch64-linux-android${ANDROID_API}-clang"
          export AR="$toolchain/bin/llvm-ar"
          export RANLIB="$toolchain/bin/llvm-ranlib"
          export CFLAGS="-fPIC -O2"

          ./configure \
            --host=aarch64-linux-android \
            --prefix="$GITHUB_WORKSPACE/ffi-install" \
            --enable-static --disable-shared --disable-docs
          make -j"$(nproc)"
          make install

          echo "libffi built:"
          ls -la "$GITHUB_WORKSPACE/ffi-install/lib"

      - name: Fetch LWJGL
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LWJGL_REF" https://github.com/LWJGL/lwjgl3.git upstream-lwjgl
          echo "Building LWJGL $LWJGL_REF at $(git -C upstream-lwjgl rev-parse --short HEAD)"

      # LWJGL is compiled against the NDK's jni.h but runs against the desktop
      # HotSpot inside the runtime pack, so every (*env)->Function() call takes
      # its offset from one header and dispatches through a table built by the
      # other. Checked here, where both headers actually exist, so an NDK or JDK
      # bump fails the build rather than misdispatching at runtime.
      - name: Check the JNI table layouts agree
        run: |
          set -euo pipefail
          ndk_jni=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/jni.h

          # This job installs no JDK of its own, so take JAVA_HOME when the
          # runner exports one and fall back to whatever is on the image.
          host_jni=${JAVA_HOME:-}/include/jni.h
          if [ ! -f "$host_jni" ]; then
            host_jni=$(find /usr/lib/jvm -name jni.h -path '*/include/jni.h' | sort | tail -1)
          fi
          echo "android: $ndk_jni"
          echo "desktop: $host_jni"
          python3 tools/lwjgl/check-jni-layout.py "$ndk_jni" "$host_jni"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S tools/lwjgl -B build-lwjgl \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DCMAKE_BUILD_TYPE=Release \
            -DLWJGL_DIR="$GITHUB_WORKSPACE/upstream-lwjgl" \
            -DFFI_ROOT="$GITHUB_WORKSPACE/ffi-install"

      - name: Build
        run: cmake --build build-lwjgl --parallel "$(nproc)"

      - name: Collect and verify
        run: |
          set -euo pipefail
          mkdir -p out/lwjgl
          find build-lwjgl -name 'liblwjgl*.so' -exec cp -v {} out/lwjgl/ \;

          if [ ! -f out/lwjgl/liblwjgl.so ]; then
            echo "the LWJGL core library was not produced" >&2
            exit 1
          fi

          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for lib in out/lwjgl/*.so; do
            echo "--- $lib"
            "$readelf" -h "$lib" | grep -E "Machine|Class"
            for align in $("$readelf" -l "$lib" | awk '/LOAD/ {print $NF}'); do
              if [ "$((align))" -lt 16384 ]; then
                echo "PT_LOAD alignment $align is below 16 KB in $lib" >&2
                exit 1
              fi
            done
            echo "alignment ok"
          done

      - name: Describe the component
        run: |
          set -euo pipefail
          cat > out/lwjgl/component.json <<JSON
          {
            "id": "lwjgl",
            "upstream": "https://github.com/LWJGL/lwjgl3",
            "upstreamRef": "${LWJGL_REF}",
            "license": "BSD-3-Clause",
            "bundles": ["libffi ${LIBFFI_VERSION} (MIT, linked statically)"],
            "abi": "${ANDROID_ABI}",
            "minSdk": ${ANDROID_API},
            "maxPageSizeBytes": 16384
          }
          JSON
          cat out/lwjgl/component.json

      - name: Package
        run: |
          set -euo pipefail
          (cd out && tar -czf lwjgl-${ANDROID_ABI}.tar.gz lwjgl)
          sha1sum out/lwjgl-${ANDROID_ABI}.tar.gz | tee out/lwjgl-${ANDROID_ABI}.tar.gz.sha1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lwjgl-${{ env.ANDROID_ABI }}
          path: out/lwjgl-*.tar.gz*
          if-no-files-found: error

  # Desktop OpenGL over Vulkan, for Minecraft 1.17 and newer.
  #
  # gl4es covers up to 1.16, where the game only asks for GL 2.1. From 1.17 it
  # requires a 3.2 core profile, which gl4es cannot give, so those versions go
  # through Zink on top of the device's own Vulkan driver.
  #
  # No Vulkan driver is built: the S24 Ultra already ships one for its GPU, and
  # replacing a vendor driver with Mesa's would trade something that works for
  # something worse. Zink is the only gallium driver enabled.
  #
  # android-strict is off. Mesa describes it as strict Android compliance,
  # where disabling "may cause CTS failures or other problems, but allows
  # drivers to expose capabilities that are normally hidden". Those hidden
  # capabilities are the desktop GL features Minecraft asks for, and CTS
  # compliance is a requirement for a system graphics driver - which this is
  # not. It is a library an app loads for itself, so nothing here is submitted
  # for certification.
  #
  # Every option below was validated by a configure-only probe before this job
  # was written to compile anything, because Mesa is a long build and finding a
  # typo after fifteen minutes is an expensive way to learn.
  mesa:
    name: Build Mesa/Zink (desktop GL over Vulkan)
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Mesa generates much of its own source, so the host needs the
      # generators: mako for the Python templates, bison and flex for the GLSL
      # parser, glslang for the SPIR-V Zink consumes. None ships in the pack.
      - name: Install Mesa's build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex glslang-tools cmake pkg-config
          python3 -m pip install --quiet --upgrade meson ninja mako pyyaml

      # pkg-config is a real binary, with pkg_config_libdir pointing only at
      # the cross-built dependency tree - so lookups name the dependency that
      # is missing, while nothing from the host can leak into an Android build.
      - name: Write the NDK cross file
        run: |
          set -euo pipefail
          tc=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          deps=$GITHUB_WORKSPACE/android-deps
          mkdir -p "$deps/lib/pkgconfig"
          cat > cross-android-arm64.ini <<INI
          [binaries]
          c = '$tc/aarch64-linux-android${ANDROID_API}-clang'
          cpp = '$tc/aarch64-linux-android${ANDROID_API}-clang++'
          ar = '$tc/llvm-ar'
          strip = '$tc/llvm-strip'
          pkg-config = 'pkg-config'

          [properties]
          pkg_config_libdir = '$deps/lib/pkgconfig'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          INI

      # Mesa asks for libdrm even with only Zink enabled. Core library only:
      # every hardware-specific backend is off, since the GPU driver on the
      # device is the vendor's.
      - name: Cross-compile libdrm
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LIBDRM_REF" \
            https://gitlab.freedesktop.org/mesa/drm.git upstream-drm
          meson setup upstream-drm/build-android upstream-drm \
            --cross-file "$GITHUB_WORKSPACE/cross-android-arm64.ini" \
            --prefix "$GITHUB_WORKSPACE/android-deps" \
            --buildtype release \
            -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled \
            -Dnouveau=disabled -Dvmwgfx=disabled -Dfreedreno=disabled \
            -Dvc4=disabled -Detnaviv=disabled \
            -Dcairo-tests=disabled -Dman-pages=disabled \
            -Dvalgrind=disabled -Dtests=false \
            -Dc_link_args=-Wl,-z,max-page-size=16384 \
            -Dcpp_link_args=-Wl,-z,max-page-size=16384
          meson compile -C upstream-drm/build-android
          meson install -C upstream-drm/build-android

      - name: Fetch Mesa
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git upstream-mesa
          echo "Mesa $MESA_REF at $(git -C upstream-mesa rev-parse --short HEAD)"

      - name: Configure
        run: |
          set -euo pipefail
          meson setup upstream-mesa/build-android upstream-mesa \
            --cross-file "$GITHUB_WORKSPACE/cross-android-arm64.ini" \
            --buildtype release \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dandroid-strict=false \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers= \
            -Degl=enabled \
            -Dopengl=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dllvm=disabled \
            -Dshared-glapi=enabled \
            -Dc_link_args=-Wl,-z,max-page-size=16384 \
            -Dcpp_link_args=-Wl,-z,max-page-size=16384

      - name: Build
        run: meson compile -C upstream-mesa/build-android

      # Prints everything produced before deciding what to keep: the names Mesa
      # gives its Android libraries are what the GLFW bridge will have to
      # dlopen, so they are read from the build rather than assumed.
      - name: Collect and verify
        run: |
          set -euo pipefail
          echo "===== every shared object Mesa produced ====="
          find upstream-mesa/build-android -name '*.so*' -type f | sort

          # src/android_stub is deliberately excluded. android-stub=true builds
          # fake liblog, libcutils, libhardware, libnativewindow and libsync so
          # Mesa can link without an AOSP tree. They are link-time placeholders;
          # the device has the real ones. Shipping the stubs would put
          # non-functional implementations ahead of the platform's own.
          mkdir -p out/mesa
          find upstream-mesa/build-android -name '*.so' -type f \
            -not -path '*/android_stub/*' \
            -exec cp -v {} out/mesa/ \;
          cp -v "$GITHUB_WORKSPACE/android-deps/lib/libdrm.so" out/mesa/ 2>/dev/null || true

          if [ -z "$(ls -A out/mesa)" ]; then
            echo "Mesa produced no shared objects" >&2
            exit 1
          fi

          readelf=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for lib in out/mesa/*.so; do
            echo "--- $lib"
            "$readelf" -h "$lib" | grep -E "Machine|Class"
            for align in $("$readelf" -l "$lib" | awk '/LOAD/ {print $NF}'); do
              if [ "$((align))" -lt 16384 ]; then
                echo "PT_LOAD alignment $align is below 16 KB in $lib" >&2
                exit 1
              fi
            done
            echo "alignment ok"
          done

      # The whole Zink integration rests on this symbol. LWJGL resolves GL
      # functions by looking inside the loaded library for an address-getter,
      # and since Mesa builds no desktop libGL for Android, eglGetProcAddress
      # is the entire path - there is nothing to fall back to. Asserted here
      # rather than discovered as a black screen on the device.
      - name: Check libEGL exports the address-getter LWJGL needs
        run: |
          set -euo pipefail
          nm=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          if ! "$nm" -D --defined-only out/mesa/libEGL.so | grep -q ' eglGetProcAddress$'; then
            echo "libEGL.so does not export eglGetProcAddress; LWJGL would have no" >&2
            echo "way to resolve a single OpenGL function through this pack." >&2
            exit 1
          fi
          echo "eglGetProcAddress: exported"

          echo "EGL entry points exported: $("$nm" -D --defined-only out/mesa/libEGL.so | grep -c ' egl')"

      - name: Describe the component
        run: |
          set -euo pipefail
          cat > out/mesa/component.json <<JSON
          {
            "id": "mesa-zink",
            "backendId": "zink",
            "upstream": "https://gitlab.freedesktop.org/mesa/mesa",
            "upstreamRef": "${MESA_REF}",
            "license": "MIT",
            "bundles": ["libdrm ${LIBDRM_REF} (MIT)"],
            "requiresVulkan": true,
            "androidStrict": false,
            "abi": "${ANDROID_ABI}",
            "minSdk": ${ANDROID_API},
            "maxPageSizeBytes": 16384
          }
          JSON
          cat out/mesa/component.json

      - name: Package
        run: |
          set -euo pipefail
          (cd out && tar -czf mesa-zink-${ANDROID_ABI}.tar.gz mesa)
          sha1sum out/mesa-zink-${ANDROID_ABI}.tar.gz | tee out/mesa-zink-${ANDROID_ABI}.tar.gz.sha1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mesa-zink-${{ env.ANDROID_ABI }}
          path: out/mesa-zink-*.tar.gz*
          if-no-files-found: error

  # Scaffolding, not a build.
  #
  # OpenJDK is the last missing component and the one most likely not to work.
  # The OpenJDK Mobile Project carries Android support in tree, and it is
  # small: platform.m4 maps android onto HOTSPOT_OS=linux, so HotSpot's linux
  # sources compile against Bionic, and the rest is a handful of accommodations.
  #
  # Two things make it uncertain rather than routine. The build defines both
  # -DLINUX and -D_ALLBSD_SOURCE and puts os/linux and os/bsd on the include
  # path at once, which is a hybrid no other target uses. And the project's
  # only branch is master, currently JDK 28 - a development tip, where
  # sun.misc.Unsafe's memory accessors are marked for removal and Minecraft's
  # ecosystem targets 17 or 21.
  #
  # So this configures and stops, to find out how far the port actually gets
  # before spending an hour of build time on it.
  openjdk-probe:
    name: Probe OpenJDK's Android target
    if: ${{ inputs.probe_openjdk }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out NikLauncher
        uses: actions/checkout@v4

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up the boot JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf zip unzip build-essential

      - name: Fetch the OpenJDK Mobile Project
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            https://github.com/openjdk/mobile.git upstream-jdk
          git -C upstream-jdk checkout -q "$OPENJDK_REF"
          echo "OpenJDK Mobile at $(git -C upstream-jdk rev-parse --short HEAD)"
          grep -E "^DEFAULT_VERSION_FEATURE" upstream-jdk/make/conf/version-numbers.conf

      # Configure only. It resolves the toolchain and every dependency, which is
      # where a cross-compilation target that does not really work shows itself.
      - name: Try to configure for aarch64-linux-android
        id: configure
        continue-on-error: true
        run: |
          set -euo pipefail
          tc=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          cd upstream-jdk
          bash configure \
            --openjdk-target=aarch64-linux-android \
            --with-boot-jdk="$JAVA_HOME" \
            --with-toolchain-type=clang \
            --with-sysroot="$tc/sysroot" \
            --with-jvm-variants=server \
            --with-debug-level=release \
            --enable-headless-only \
            --disable-warnings-as-errors \
            CC="$tc/bin/clang" \
            CXX="$tc/bin/clang++" \
            AR="$tc/bin/llvm-ar" \
            STRIP="$tc/bin/llvm-strip" \
            NM="$tc/bin/llvm-nm" \
            OBJCOPY="$tc/bin/llvm-objcopy"

      # Always reported: on this component the failure is the finding.
      - name: Report what configure decided
        if: always()
        run: |
          set -euo pipefail
          cd upstream-jdk
          if [ -f build/*/config.log ]; then
            echo "===== tail of config.log ====="
            tail -100 build/*/config.log
          else
            echo "no config.log was produced"
          fi
          if [ -f build/*/spec.gmk ]; then
            echo "===== configure succeeded; key settings ====="
            grep -E "^(OPENJDK_TARGET_OS|OPENJDK_TARGET_CPU|HOTSPOT_TARGET_OS|CC|CXX|BOOT_JDK) " build/*/spec.gmk | head -20
          fi

      - name: Fail if configure failed
        if: steps.configure.outcome == 'failure'
        run: |
          echo "OpenJDK's Android target did not configure; see the log above." >&2
          exit 1
